<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library App</title>
  </head>
  <body>
    <h1>My Library</h1>

    <div id="library"></div>

    <dialog id="bookDialog">
      <form id="bookForm">
        <div>
          <p>Please Enter Your Book Details Below</p>

          <div>
            <label for="bookTitle">Book Title</label>

            <input
              type="text"
              id="bookTitle"
              placeholder="Enter book title"
              required
              minlength="2"
            />

            <span id="bookTitleError" class="error"></span>
          </div>

          <div>
            <label for="bookAuthor">Book Author</label>

            <input
              type="text"
              id="bookAuthor"
              placeholder="Enter book author"
              required
              minlength="2"
            />

            <span id="bookAuthorError" class="error"></span>
          </div>

          <div>
            <label for="bookPages">Book Pages</label>

            <input
              type="number"
              id="bookPages"
              placeholder="Enter book pages"
              required
              min="1"
            />

            <span id="bookPagesError" class="error"></span>
          </div>
        </div>

        <div>
          <button
            type="button"
            formmethod="dialog"
            id="cancelBtn"
          >
            Cancel
          </button>

          <button type="button" id="confirmBtn">
            Confirm
          </button>
        </div>
      </form>
    </dialog>

    <p>
      <button id="newBook">New Book</button>
    </p>
  </body>
</html>
