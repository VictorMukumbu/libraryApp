<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library App</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Link to external CSS -->
  </head>
  <body>
    <h1>My Library</h1>
    <div id="library"></div>

    <!-- A modal dialog containing a form -->
    <dialog id="bookDialog">
      <form id="bookForm">
        <div>
          <p>Please Enter Your book details Below</p>
          <div>
            <label for="bookTitle">Book Title</label>
            <input type="text" id="bookTitle" placeholder="Enter book title" />
          </div>
          <div>
            <label for="bookAuthor">Book Author</label>
            <input
              type="text"
              id="bookAuthor"
              placeholder="Enter book author"
            />
          </div>
          <div>
            <label for="bookPages">Book Pages</label>
            <input
              type="number"
              id="bookPages"
              placeholder="Enter book pages"
            />
          </div>
        </div>

        <div>
          <button type="button" formmethod="dialog" id="cancelBtn">
            Cancel
          </button>
          <button type="button" id="confirmBtn">Confirm</button>
        </div>
      </form>
    </dialog>

    <p>
      <button id="newBook">New Book</button>
    </p>
    <!-- modal end -->

    <script src="script.js"></script>
    <!-- Link to external JS -->
  </body>
</html>
